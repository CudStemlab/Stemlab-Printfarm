name: Build and Push Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Forks set DOCKERHUB_USERNAME in repo secrets; it's the push registry
      # prefix for the built image.
      IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          : "${IMAGE_PREFIX:?DOCKERHUB_USERNAME secret is not set}"
          test -n "${{ secrets.DOCKERHUB_TOKEN }}" || { echo "DOCKERHUB_TOKEN secret is not set"; exit 1; }

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ONE image. Dockerfile.single is the whole farm — PostgreSQL, the Node web
      # server (with the slicer proxy and MCP server embedded), the Go poller and
      # the Go exporter — matching the default docker-compose.yml. The old
      # per-service images (printfarm-web/-nginx/-poller/-exporter/-slicer-proxy/
      # -mcp) are no longer published; build the multi-container stack from source
      # with `docker compose -f docker-compose.multi.yml up --build`.
      #
      # The image gets an immutable `sha-<12>` tag alongside the moving `latest`.
      # That per-commit tag is what makes rollback possible: the admin "Roll back"
      # button dispatches .github/workflows/rollback.yml, which re-points `latest`
      # at one of these tags (see docker-compose.deploy.yml).
      # 12 hex chars, not 7 — 7 starts colliding on a long-lived repo.
      - name: Derive short SHA
        run: echo "SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            -f Dockerfile.single \
            --build-arg VITE_PUBLIC_VIEWER_MODE='${{ vars.PUBLIC_VIEWER_MODE || 'false' }}' \
            --build-arg APP_VERSION='${{ github.sha }}' \
            -t "${IMAGE_PREFIX}/printfarm:latest" \
            -t "${IMAGE_PREFIX}/printfarm:sha-${SHORT_SHA}" .

      # Push the immutable sha-* tag BEFORE latest, so a rollback target always
      # exists for anything `latest` has ever pointed at. If the run dies between
      # the two steps the worst case is a published version nobody is running,
      # rather than a running version nobody can roll back to.
      - name: Push sha-tagged image
        run: docker push "${IMAGE_PREFIX}/printfarm:sha-${SHORT_SHA}"

      - name: Push latest image
        run: docker push "${IMAGE_PREFIX}/printfarm:latest"

      - name: Summary
        run: |
          echo "### Published \`${IMAGE_PREFIX}/printfarm\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`sha-${SHORT_SHA}\` (immutable, rollback target)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`latest\` (what Watchtower pulls)" >> "$GITHUB_STEP_SUMMARY"
