# Production deploy override — runs the prebuilt image published by
# .github/workflows/deploy.yml (Docker Hub) instead of building from source.
#
# Deploys are MANUAL. There is deliberately no Watchtower sidecar and nothing on
# the host watches the registry: a new image is only ever picked up when you run
# the two commands below. The dashboard still *tells* you a newer commit exists
# (Settings → Maintenance compares the baked APP_VERSION against
# UPDATE_CHECK_BRANCH) — it just can't apply it for you.
#
# Update a deployed host:
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d
#
# (or `make deploy-pull` from a checkout on that host.)
#
# ⚠️ Leave WATCHTOWER_TOKEN **empty** in .env. It is what gates the in-app
# "Update now" and "Roll back" buttons: empty hides them, and the endpoints
# answer 503. Setting it without a Watchtower sidecar running would show buttons
# that fail when clicked.
#
# ROLLING BACK without Watchtower: run .github/workflows/rollback.yml manually
# from the repo's Actions tab (input: the commit SHA). It re-points
# `<IMAGE_PREFIX>/printfarm:latest` at that commit's immutable `sha-<12>` tag
# registry-side; then pull + up -d on the host as above. Migrations are
# forward-only and are NOT reverted, so the older image must tolerate the newer
# schema.
#
# Requires in .env:
#   IMAGE_PREFIX       Docker Hub namespace the image was pushed under
#                      (the DOCKERHUB_USERNAME used by the workflow).
#   UPDATE_CHECK_REPO  "owner/repo" so the update card knows what to compare.
#
# Tip: set COMPOSE_FILE="docker-compose.yml:docker-compose.deploy.yml" in the
# deploy host's .env (see .env.example) and Compose merges both files by
# default — plain `docker compose pull`/`up -d` then just work, with no `-f`
# flags to remember.
#
# The `!reset null` tag that drops the inherited `build:` needs Docker Compose
# v2.24.4+ (Jan 2024); on older Compose, delete that line and run
# `docker compose pull` first so the pulled image is used instead of a local
# rebuild.
#
# ⚠️ The database lives INSIDE this container (the `pgdata` volume). `up -d`
# after a pull recreates it, which stops and restarts PostgreSQL — a short full
# outage, not a rolling per-service restart. The volume is what persists.
services:
  printfarm:
    build: !reset null
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX to the Docker Hub namespace}/printfarm:latest
