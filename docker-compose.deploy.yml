# Production deploy override — runs the prebuilt image published by
# .github/workflows/deploy.yml (Docker Hub) instead of building from source, and
# adds the Watchtower sidecar that powers the admin "Update now" button.
#
# This overlays the DEFAULT single-container stack (docker-compose.yml). CI
# publishes exactly one image, `${IMAGE_PREFIX}/printfarm`, built from
# Dockerfile.single — the whole farm. The multi-container stack
# (docker-compose.multi.yml) has no published images and must be built from
# source: `docker compose -f docker-compose.multi.yml up --build`.
#
# Usage on a deployed host:
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d
#
# Tip: set COMPOSE_FILE="docker-compose.yml:docker-compose.deploy.yml" in the
# deploy host's .env (see .env.example) and Compose merges both files by
# default — plain `docker compose up`/`down`/`pull` then just work, with no
# `-f` flags to remember and no risk of a bare `down` skipping this file and
# leaving watchtower (and the network it's attached to) behind.
#
# Requires in .env:
#   IMAGE_PREFIX       Docker Hub namespace the image was pushed under
#                      (the DOCKERHUB_USERNAME used by the workflow).
#   WATCHTOWER_TOKEN   shared secret; must match the app's value so the web
#                      server can trigger an update.
#   WATCHTOWER_URL     http://watchtower:8080/v1/update (the compose default is
#                      empty in the single-container stack, which hides the
#                      one-click button — set it here to enable it).
#   UPDATE_CHECK_REPO  "owner/repo" so the update card knows what to compare.
#   WATCHTOWER_DOCKER_SOCK  (optional) host path of the Docker socket that
#                      `docker compose` itself talks to — default assumes a
#                      normal rootful install at /var/run/docker.sock. On a
#                      **rootless Docker** host, compose actually manages
#                      containers through the per-user socket instead (find it
#                      with `docker context ls` / `docker info | grep -i sock`
#                      — typically /run/user/<uid>/docker.sock). Bind-mounting
#                      the wrong one leaves Watchtower unable to see or recreate
#                      any containers: it can crash-loop with "permission
#                      denied ... docker.sock" (rootless remaps container root
#                      to an unprivileged host uid outside the `docker` group)
#                      or silently manage a different, unrelated daemon.
#
# Watchtower can only update containers whose image is *pulled* (not built), which
# is why this override replaces the app service's `build:` with an `image:`
# reference. The `!reset null` tag that drops the inherited `build:` needs Docker
# Compose v2.24.4+ (Jan 2024); on older Compose, delete that `build: !reset null`
# line and run with `docker compose pull` first so the pulled image is used
# instead of a local rebuild.
#
# WATCHTOWER SCOPE: the `com.centurylinklabs.watchtower.enable=true` label below
# appears on the app container and on NOTHING else. Paired with `--label-enable`
# on the watchtower command, that is what stops an update from touching any other
# container on the host — or watchtower itself. Without it Watchtower considers
# every running container and will happily recreate an unrelated database whose
# tag moved.
#
# ⚠️ Labels are baked in at container-CREATE time, so applying this needs a
# `docker compose up -d` on the deploy host. A bare `docker compose pull` leaves
# the existing container unlabelled, and Watchtower would then see nothing to
# update at all (label-enable with zero labelled containers = no-op).
#
# ⚠️ The database lives INSIDE this container (the `pgdata` volume). Recreating
# it on update is safe — the volume is what persists — but the update is a full
# stop/start of PostgreSQL, so expect a short outage rather than the rolling,
# service-by-service restart the multi-container stack had. The in-flight update
# run is written to `update_runs` before the container dies, and the new one
# resumes it on boot (scheduleUpdateRunWorker), so progress survives the bounce.
services:
  printfarm:
    build: !reset null
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX to the Docker Hub namespace}/printfarm:latest
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      # Enables the admin "Update now" button (empty in the base file, which
      # hides it because the base stack has no Watchtower sidecar).
      WATCHTOWER_URL: ${WATCHTOWER_URL:-http://watchtower:8080/v1/update}
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:?set WATCHTOWER_TOKEN to enable one-click updates}

  # On-demand updater. Runs no periodic poll — it only acts when the web server
  # POSTs to its HTTP API (the admin's "Update now" click), then pulls the newer
  # :latest image and recreates the app container.
  #
  # SECURITY: this container holds the Docker socket, so it must never be
  # published to the host. Only the app container reaches its :8080 over the
  # compose network. Keep WATCHTOWER_TOKEN secret.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    # containrrr/watchtower ships an old Docker API client (1.25); Docker Engine
    # 25+/29 requires a minimum negotiated API version of 1.40, so pin the client
    # version or the container crash-loops with "client version 1.25 is too old".
    environment:
      DOCKER_API_VERSION: ${WATCHTOWER_DOCKER_API_VERSION:-1.44}
    volumes:
      - ${WATCHTOWER_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    command:
      - "--http-api-update"
      - "--cleanup"
      # Only touch containers carrying the watchtower.enable label (the app
      # container above). Without this Watchtower manages EVERY container on the
      # host. See the scope note near the top of this file.
      - "--label-enable"
      - "--http-api-token"
      - "${WATCHTOWER_TOKEN:?set WATCHTOWER_TOKEN to enable one-click updates}"
