# Default deployment: the whole print farm in ONE container.
#
#   docker compose up --build
#   App: http://localhost:${HTTP_PORT:-8080}   Health: .../healthz
#
# One service, one image (Dockerfile.single), one volume. Everything the original
# stack ran in eight containers runs here:
#
#   PostgreSQL 16       in-container, loopback only, data in the pgdata volume
#   Node web server     SPA + /api/* + /api/v1 + printer proxy/webcam + /mqtt
#   slicer proxy        in-process on /printers/  (EMBED_SLICER_PROXY)
#   MCP server          in-process on /mcp        (EMBED_MCP, 403 unless published)
#   Go poller           child process
#   Go exporter         child process, printfarm_* metrics on :9180
#
# Dropped versus the multi-container stack: nginx (Node terminates the port; put
# TLS *and* rate limiting on an external reverse proxy — the app already emits
# CSP/HSTS itself), Redis (optional acceleration; set REDIS_URL to an external
# instance to re-enable), and Prometheus (scrape :9180 / :9181 from an external
# Prometheus + Grafana).
#
# The original eight-service stack is still here as `docker-compose.multi.yml`:
#
#   docker compose -f docker-compose.multi.yml up --build
#
# Reach for it when you need nginx's rate limiting, the bundled Prometheus,
# poller sharding, or per-service scaling. It builds from source — CI publishes
# only this stack's image. Both read the same .env and the same schema.

services:
  printfarm:
    build:
      context: .
      dockerfile: Dockerfile.single
      args:
        VITE_PUBLIC_VIEWER_MODE: ${VITE_PUBLIC_VIEWER_MODE:-false}
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    # Every process in the container (PostgreSQL included) runs as the
    # unprivileged `printfarm` user, so both hardening flags apply.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    ports:
      # Public site.
      - "${HTTP_PORT:-8080}:5173"
      # Metrics. Bind to loopback so an external Prometheus on the same host can
      # scrape them while the internet cannot; drop these two lines entirely if
      # you don't run Prometheus.
      - "127.0.0.1:${EXPORTER_PORT:-9180}:9180"
      - "127.0.0.1:${WEB_METRICS_PORT:-9181}:9181"
    volumes:
      - pgdata:/var/lib/printfarm/pgdata
      # Backup-restore uploads are spooled to disk (up to BACKUP_UPLOAD_MAX_BYTES),
      # so keep them off the container's writable layer.
      - backup_tmp:/var/tmp/printfarm
    environment:
      # --- in-container PostgreSQL -----------------------------------------
      # The cluster is created on first boot with these credentials. Changing
      # them later does NOT re-initialize an existing volume.
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Set EMBEDDED_POSTGRES=false plus DATABASE_URL to point at an external
      # database instead (the container then holds only the app processes).
      EMBEDDED_POSTGRES: ${EMBEDDED_POSTGRES:-true}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_POOL_IDLE_MS: ${DATABASE_POOL_IDLE_MS:-30000}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-5000}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      DATABASE_IDLE_TX_TIMEOUT_MS: ${DATABASE_IDLE_TX_TIMEOUT_MS:-60000}
      # Optional external Redis (there is no Redis in this image). Empty =
      # Postgres/in-memory fallbacks, which is the supported default.
      REDIS_URL: ${REDIS_URL:-}

      # --- embedded services -------------------------------------------------
      EMBED_SLICER_PROXY: ${EMBED_SLICER_PROXY:-true}
      EMBED_MCP: ${EMBED_MCP:-true}
      # Fail-closed exactly like the nginx gate it replaces: /mcp answers 403 on
      # the public port unless this is true (it stays printfarm_manage-gated).
      MCP_HTTP_PUBLIC: ${MCP_HTTP_PUBLIC:-false}
      # Where /metrics moves to now that nginx isn't there to 404 it publicly.
      METRICS_LISTEN_PORT: ${METRICS_LISTEN_PORT:-9181}
      EXPORTER_PORT: 9180
      RUN_POLLER: ${RUN_POLLER:-true}
      RUN_EXPORTER: ${RUN_EXPORTER:-true}

      # --- web ---------------------------------------------------------------
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_HTTP: ${LOG_HTTP:-sample}
      VITE_PUBLIC_VIEWER_MODE: ${VITE_PUBLIC_VIEWER_MODE:-false}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      QUEUE_UPLOAD_MAX_BYTES: ${QUEUE_UPLOAD_MAX_BYTES:-52428800}
      BACKUP_UPLOAD_MAX_BYTES: ${BACKUP_UPLOAD_MAX_BYTES:-2147483648}
      BACKUP_TMP_DIR: ${BACKUP_TMP_DIR:-/var/tmp/printfarm}
      # Public origin for OAuth redirect_uri and the slicer device-tab redirect.
      # With no nginx in front, set this whenever an external proxy terminates
      # TLS or rewrites the host.
      APP_BASE_URL: ${APP_BASE_URL:-}
      HTTP_PORT: ${HTTP_PORT:-8080}
      # Set true once an external reverse proxy serves the site over HTTPS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # With nginx gone, X-Real-IP / X-Forwarded-For are client-supplied unless a
      # trusted reverse proxy sets them — believing them would let anyone mint a
      # fresh login-rate-limit bucket per request and forge audit-log IPs. Left
      # false here; set true ONLY when an external proxy overwrites both headers.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      PRINTER_SECRET_KEY: ${PRINTER_SECRET_KEY:-}
      SLICER_GRANT_SECRET: ${SLICER_GRANT_SECRET:-}
      STATUS_LIGHT_ENABLED: ${STATUS_LIGHT_ENABLED:-true}
      STATUS_LIGHT_MQTT_ENABLED: ${STATUS_LIGHT_MQTT_ENABLED:-true}
      # Admin update check. Deploys are manual: leave WATCHTOWER_TOKEN empty (it
      # is what shows the in-app "Update now" / "Roll back" buttons) and update
      # with `docker compose up --build -d`, or `pull` + `up -d` with
      # docker-compose.deploy.yml on a host running the published image. The
      # check itself still reports when a newer commit exists.
      UPDATE_CHECK_REPO: ${UPDATE_CHECK_REPO:-}
      UPDATE_CHECK_BRANCH: ${UPDATE_CHECK_BRANCH:-main}
      UPDATE_CHECK_TOKEN: ${UPDATE_CHECK_TOKEN:-}
      WATCHTOWER_URL: ${WATCHTOWER_URL:-}
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:-}

      # --- poller ------------------------------------------------------------
      PRINTER_POLL_INTERVAL_MS: ${PRINTER_POLL_INTERVAL_MS:-5000}
      PRINTER_REQUEST_TIMEOUT_MS: ${PRINTER_REQUEST_TIMEOUT_MS:-4000}
      PRINTER_OFFLINE_GRACE_SECONDS: ${PRINTER_OFFLINE_GRACE_SECONDS:-30}
      PRINTER_PERSIST_MAX_INTERVAL_MS: ${PRINTER_PERSIST_MAX_INTERVAL_MS:-60000}
      PRINTER_POLL_CONCURRENCY: ${PRINTER_POLL_CONCURRENCY:-0}
      PRINTER_POLL_CONCURRENCY_MAX: ${PRINTER_POLL_CONCURRENCY_MAX:-64}
      # Sharding is a multi-replica feature; a single container is always shard 0.
      POLLER_SHARD_COUNT: 1
      POLLER_SHARD_INDEX: 0
      BAMBU_TLS_SKIP_VERIFY: ${BAMBU_TLS_SKIP_VERIFY:-true}
      BAMBU_CERT_PINS: ${BAMBU_CERT_PINS:-}

      # --- slicer proxy (embedded) ------------------------------------------
      SLICER_UPLOAD_MAX_BYTES: ${SLICER_UPLOAD_MAX_BYTES:-524288000}
      SLICER_AMS_AUTO: ${SLICER_AMS_AUTO:-true}

volumes:
  pgdata:
  backup_tmp:
